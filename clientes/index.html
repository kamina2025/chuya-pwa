<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#10b981" />
        <meta name="description" content="PWA Chuya - Economía circular, mensajería y recompensas XNO" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="Chuya" />

        <title>Chuya | PWA Economía Circular</title>

        <!-- PWA Web App Manifest & Favicon compartido en raíz chuya-pwa/assets/icons/ -->
        <link rel="manifest" href="manifest.json" />
        <link rel="icon" type="image/png" href="../assets/icons/favicon.png" />
        <link rel="apple-touch-icon" href="../assets/icons/icon-192.png" />

        <!-- Estilos principales Solarpunk -->
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <!-- Overlay/Telón para cerrar Sidebar -->
        <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

        <!-- 1. BARRA SUPERIOR (TOP BAR) -->
        <div id="header-container"></div>

        <!-- 2. SIDEBAR DESLIZABLE (OFF-CANVAS DRAWER) -->
        <div id="sidebar-container"></div>

        <!-- CONTENIDO PRINCIPAL / VISTAS DINÁMICAS -->
        <main id="main-content" class="container">
            <!-- Cargador por defecto antes de inyectar vista -->
            <div id="view-loader" class="text-center">
                <p>🌱 Cargando experiencia Solarpunk...</p>
            </div>
        </main>

        <!-- 3. BARRA INFERIOR DE NAVEGACIÓN (BOTTOM NAV BAR) -->
        <div id="bottom-bar-container"></div>

        <!-- Monitoreo inicial del App Shell Clientes -->
        <script>
            console.log("[Chuya::ClientesIndex] App Shell HTML cargado. Ruta base:", window.location.pathname);
        </script>

        <!-- Scripts de la aplicación PWA -->
        <script src="js/ui-loader.js" defer></script>
        <script type="module" src="js/app.js"></script>
    </body>
</html>
